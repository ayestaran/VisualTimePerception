<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project README</title>
    <link rel="stylesheet" href="/static/readme.css" />
  </head>
  <body>
    <main class="readme-page">
      <button id="themeToggleBtn" class="theme-toggle" type="button" aria-label="Toggle dark and light theme">
        <span id="themeIcon" aria-hidden="true"></span>
      </button>

      <header class="hero">
        <h1>{{ hero_title }}</h1>
        {% if hero_subtitle %}
        <p>{{ hero_subtitle }}</p>
        {% endif %}
      </header>

      {% for section in readme_sections %}
      <section class="panel">
        <h2>{{ section.title }}</h2>
        <article class="readme-content">{{ section.html | safe }}</article>
      </section>
      {% endfor %}
    </main>

    <script src="/static/readme.js"></script>
  </body>
</html>
